security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Admin temporaire en mémoire jusqu'à l'entité Doctrine User.
        # Email : admin@runchrono.local — Mot de passe : RunChrono!2026
        app_users:
            memory:
                users:
                    admin@runchrono.local:
                        password: '$2y$12$/AXDR.t0K5A.mqrZM5QNmu99/l8OFJ4t3MiMbhwrDKb.6W6gt77fe'
                        roles: ['ROLE_ADMIN']

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
                username_parameter: _username
                password_parameter: _password
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        # À renforcer plus tard quand d'autres routes admin existent :
        # - { path: ^/, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
